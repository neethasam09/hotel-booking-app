<app-home></app-home>
<h2 class="my-3">Create a new reservation</h2>
<form [formGroup]="reservationForm" (ngSubmit)="onSubmit()">
    <div class="row">
        <div class="col">
            <div class="mb-3">
                <label class="form-label">Check-In Date:</label>
                <input class="form-control" type="date" formControlName="checkInDate">
                <small class="form-text text-danger"
                    *ngIf="reservationForm.get('checkInDate')?.invalid && reservationForm.get('checkInDate')?.touched">Check
                    In Date is requried</small>
            </div>
        </div>
        <div class="col">
            <div class="mb-3">
                <label class="form-label">Check-Out Date:</label>
                <input class="form-control" type="date" formControlName="checkOutDate">
                <small class="form-text text-danger"
                    *ngIf="reservationForm.get('checkOutDate')?.invalid && reservationForm.get('checkOutDate')?.touched">Check
                    Out Date is requried</small>
            </div>
        </div>

    </div>


    <div class="mb-3">
        <label class="form-label">Guest Name:</label>
        <input class="form-control" type="text" formControlName="guestName">
        <small class="form-text text-danger"
            *ngIf="reservationForm.get('guestName')?.invalid && reservationForm.get('guestName')?.touched">Guest Name is
            requried</small>
    </div>
    <div class="mb-3">
        <label class="form-label">Guest Email:</label>
        <input class="form-control" type="email" formControlName="guestEmail">
        <small class="form-text text-danger"
            *ngIf="reservationForm.get('guestEmail')?.invalid && reservationForm.get('guestEmail')?.touched">Guest Email
            is requried</small>
    </div>
    <div class="mb-3">
        <label class="form-label">Room Number:</label>
        <input class="form-control" type="number" formControlName="roomNumber">
        <small class="form-text text-danger"
            *ngIf="reservationForm.get('roomNumber')?.invalid && reservationForm.get('roomNumber')?.touched">Room Number
            is requried</small>
    </div>

    <div class="text-center">
        <button class="btn btn-primary" type="submit" [disabled]="reservationForm.invalid">Submit</button>
    </div>

</form>
